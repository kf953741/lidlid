name: macOS build and state tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show compiler
        run: swift --version
      - name: Run session and localization tests
        run: swift test
      - name: Verify free open-lid mode and uninterrupted trial expiry
        run: zsh scripts/test-store-model.sh
      - name: Build application bundle
        run: zsh scripts/build.sh
      - name: Verify local signature
        run: python3 scripts/verify-sandbox.py dist/LidLid.app
      - name: Build and inspect optional compatibility component
        run: |
          zsh scripts/build-compatibility.sh
          python3 scripts/verify-compatibility.py "dist/LidLid Compatibility.app"
      - name: Verify App Store materials and privacy pages
        run: |
          node scripts/prepare-app-store.mjs
          node website/build.mjs
      - name: Build and verify DMG
        run: zsh scripts/package-dmg.sh
