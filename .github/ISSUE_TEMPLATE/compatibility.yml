name: Compatibility report / 兼容性反馈
description: Report a real lid-close/open result / 反馈真实合盖开盖结果
title: "[Compatibility] "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the preview. Please follow docs/VALIDATION.md, use a ventilated desk, and distinguish actual task progress from a process merely remaining alive.
        感谢体验。请在通风桌面按验证说明操作，区分真实任务进展与进程仍然存活。
  - type: input
    id: model
    attributes:
      label: MacBook model / 机型
      placeholder: MacBook Pro 14-inch, M3 Pro
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version / 系统版本
    validations:
      required: true
  - type: dropdown
    id: power
    attributes:
      label: Power source / 电源
      options: [AC adapter / 接通电源, Battery / 电池供电]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lidune version / 软件版本
      placeholder: v1.1.0-preview.1
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Time with the lid closed / 合盖持续时间
      placeholder: 30 seconds
    validations:
      required: true
  - type: dropdown
    id: progress
    attributes:
      label: Did the local task advance while the lid was closed? / 合盖期间本机任务是否实际推进？
      options: [Yes / 是, No / 否, Could not establish / 无法确认]
    validations:
      required: true
  - type: dropdown
    id: reset
    attributes:
      label: Did the next lid close sleep normally after reopening? / 开盖后下一次合盖是否正常睡眠？
      options: [Yes / 是, No / 否, Not checked / 未检查]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Workflow and observations / 场景与观察
      description: Mention external displays, other sleep controllers, and the task you observed. Share only relevant, redacted excerpts.
    validations:
      required: true
