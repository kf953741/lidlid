<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">One close, one session</title><desc id="desc">Enable: on. Close the lid: still on. Reopen the lid: off. Only two visible states.</desc>
<rect width="1200" height="340" rx="20" fill="#F8F6EF"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#163C37">
<text x="56" y="44" font-size="14" letter-spacing="2">ONE CLOSE. ONE SESSION.</text>
<text x="62" y="94" font-size="23" font-weight="600">1. Enable</text>
<g color="#163C37" transform="translate(92 120) scale(3.2)"><g fill="currentColor"><path d="M3 2.7C4 4.2 5.6 5.2 7.1 5.8C10 4.4 14 4.4 16.9 5.8C18.4 5.2 20 4.2 21 2.7C21.8 5.2 21.1 7.5 20.5 9.4C22 13 20.7 16.7 17.8 18.9C16 20.2 14 21 12 21.6C10 21 8 20.2 6.2 18.9C3.3 16.7 2 13 3.5 9.4C2.9 7.5 2.2 5.2 3 2.7ZM4 11.4a3.7 4 0 1 0 7.4 0a3.7 4 0 1 0-7.4 0ZM12.6 11.4a3.7 4 0 1 0 7.4 0a3.7 4 0 1 0-7.4 0ZM10.9 16.3H13.1L12 18.6Z" fill-rule="evenodd"/><ellipse cx="7.7" cy="11.4" rx="1.9" ry="2.3"/><ellipse cx="16.3" cy="11.4" rx="1.9" ry="2.3"/></g></g>
<text x="202" y="169" font-size="17" font-weight="600">ON</text>
<text x="62" y="251" font-size="17" fill="#53615C">Turn on for this session</text>
<path d="M308 162H372m-8-7 8 7-8 7" fill="none" stroke="#9AA9A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="462" y="94" font-size="23" font-weight="600">2. Close the lid</text>
<g color="#163C37" transform="translate(492 120) scale(3.2)"><g fill="currentColor"><path d="M3 2.7C4 4.2 5.6 5.2 7.1 5.8C10 4.4 14 4.4 16.9 5.8C18.4 5.2 20 4.2 21 2.7C21.8 5.2 21.1 7.5 20.5 9.4C22 13 20.7 16.7 17.8 18.9C16 20.2 14 21 12 21.6C10 21 8 20.2 6.2 18.9C3.3 16.7 2 13 3.5 9.4C2.9 7.5 2.2 5.2 3 2.7ZM4 11.4a3.7 4 0 1 0 7.4 0a3.7 4 0 1 0-7.4 0ZM12.6 11.4a3.7 4 0 1 0 7.4 0a3.7 4 0 1 0-7.4 0ZM10.9 16.3H13.1L12 18.6Z" fill-rule="evenodd"/><ellipse cx="7.7" cy="11.4" rx="1.9" ry="2.3"/><ellipse cx="16.3" cy="11.4" rx="1.9" ry="2.3"/></g></g>
<text x="602" y="169" font-size="17" font-weight="600">ON</text>
<text x="462" y="251" font-size="17" fill="#53615C">Same enabled state</text>
<path d="M708 162H772m-8-7 8 7-8 7" fill="none" stroke="#9AA9A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="94" font-size="23" font-weight="600">3. Reopen</text>
<g color="#163C37" transform="translate(892 120) scale(3.2)"><g fill="currentColor"><path d="M3 2.7C4 4.2 5.6 5.2 7.1 5.8C10 4.4 14 4.4 16.9 5.8C18.4 5.2 20 4.2 21 2.7C21.8 5.2 21.1 7.5 20.5 9.4C22 13 20.7 16.7 17.8 18.9C16 20.2 14 21 12 21.6C10 21 8 20.2 6.2 18.9C3.3 16.7 2 13 3.5 9.4C2.9 7.5 2.2 5.2 3 2.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5.5 11.8C6.7 13.8 8.7 13.8 9.9 11.8M14.1 11.8C15.3 13.8 17.3 13.8 18.5 11.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.9 16.3H13.1L12 18.6Z"/></g></g>
<text x="1002" y="169" font-size="17" font-weight="600">OFF</text>
<text x="862" y="251" font-size="17" fill="#53615C">Return to normal sleep</text>
<text x="56" y="307" font-size="13" fill="#707C76">Two visible states: off and on. Reopening ends the one-shot session.</text></g></svg>
